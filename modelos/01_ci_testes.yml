name: CI Python

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testar Python
    runs-on: ubuntu-latest
    steps:
      - name: Buscar codigo
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Executar testes
        run: python -m unittest discover -s tests -v
